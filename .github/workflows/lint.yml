name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  markdownlint:
    name: Markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2

      - name: Lint Markdown
        run: markdownlint-cli2 "content/**/*.md"

  htmlhint:
    name: HTMLhint (built site)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Build with the pinned version rather than 'latest', so this job grades
      # the site on the Hugo that Cloudflare Pages actually deploys with. A CI
      # build on a version production never runs is not a gate for production.
      # NOTE: Cloudflare Pages cannot read .hugo-version — Pages supports no
      # version file for Hugo, only the HUGO_VERSION project env var, which is
      # set by hand in the dashboard and must be kept equal to this file.
      # Nothing yet fails when the two drift: aixgo-dev/web#32.
      - name: Read the pinned Hugo version
        id: hugo-pin
        run: |
          ./scripts/check-hugo-version.sh shape
          echo "version=$(cat .hugo-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: ${{ steps.hugo-pin.outputs.version }}
          extended: true

      # Proves the version that built the site below IS the pinned one, rather
      # than trusting that the setup step honoured its input.
      - name: Confirm the installed Hugo matches the pin
        run: ./scripts/check-hugo-version.sh binary

      - name: Build site
        run: hugo --minify --environment production

      # /llms.txt and /llms-full.txt are generated from content/ and data/, so
      # the way they break is by quietly ceasing to be generated: an output
      # format dropped from [outputs], a renamed template, a guide whose front
      # matter loses its category. The step sits in this job rather than a job
      # of its own because this job is already a required check and already has
      # the built site to grade.
      - name: Gate the generated llms.txt pair
        run: ./scripts/check-llms.sh shape docs links full

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install htmlhint
        run: npm install -g htmlhint

      - name: Lint HTML
        run: htmlhint "public/**/*.html" --config .htmlhintrc

  release-fact:
    name: Release fact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gate the release fact (shape, and scope for bot PRs)
        run: ./scripts/check-release.sh shape scope

  # The gate #22 proved was missing: an unparseable workflow merged and
  # registered with no dispatchable triggers, silently. actionlint catches
  # broken YAML, bad expressions, and shellcheck issues in run blocks.
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color
