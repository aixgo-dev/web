# --- 06 Install -------------------------------------------------------------

prerequisites:
  - "GitHub Actions on the repository, with minutes to spend."
  - "Your own model provider key. Codex on Azure OpenAI is what the reusable workflow runs today."
  - "A gate you trust: one command that fails when the code is wrong."

install_steps:
  - title: "Create your own GitHub App"
    you: true
    body: >-
      App names are globally unique, so it cannot be named after ours, and its
      private key is what mints the tokens that act on your repository. Grant
      Contents, Pull requests and Issues only. Disable the webhook: the App is
      an identity, not a delivery target, and there is no Aixgo server to
      receive deliveries.
  - title: "Run aixgo-code init --workflow"
    body: >-
      That writes .github/aixgo.yml, writes .github/workflows/aixgo.yml pinned
      to a released reusable-workflow tag, and creates the ax:* labels through
      your local gh auth.
  - title: "Fill in the real gate"
    body: "Set gate: in .github/aixgo.yml to whatever your repo already runs to know a change is good."
  - title: "Add the four repository values"
    body: >-
      Variables AIXGO_GH_APP_CLIENT_ID and AIXGO_AZURE_OPENAI_ENDPOINT, secrets
      AIXGO_GH_APP_PRIVATE_KEY and AIXGO_AZURE_OPENAI_API_KEY. The private key
      must be the full PEM, BEGIN and END lines included.
  - title: "Open the setup pull request and merge it yourself"
    you: true
    body: >-
      Setup files are written locally by aixgo-code init and merged by a human,
      because the runtime holds no workflows permission and cannot add its own
      workflow files.
  - title: "File an issue and apply ax:go"
    body: >-
      Reviews submitted on the resulting pull request call back into the same
      reusable workflow for the fix-on-request loop.

# --- 07 Configuration -------------------------------------------------------

config_keys:
  - key: "gate"
    required: true
    body: "The command that decides whether a change is good. The one key with no default."
  - key: "review: true"
    body: "Turns on the read-only reviewer. It comments; it never approves and never merges."
  - key: "prDescription: rich"
    body: "Adds a generated walkthrough, a changes table and a sequence diagram to each pull request body."
  - key: "attribution: false"
    body: "Drops the Co-Authored-By trailer and the pull-request footer the agent adds by default."

