# Aixgo Code product page (/code/).
#
# Every claim here traces to a line in https://github.com/aixgo-dev/code
# README.md. If a fact is not in that README, it does not belong on the page.
# Prose lives in layouts/_default/code.html; the lists live here.

repo: "https://github.com/aixgo-dev/code"
release: "v0.5.0"
license: "Apache-2.0"

# --- Hero -------------------------------------------------------------------

hero:
  eyebrow: "Aixgo Code · Open source · Beta"
  headline: "An autonomous coding agent that runs inside your GitHub, not ours."
  subhead: >-
    File an issue, apply one label, and get a pull request that a human still
    has to merge. Everything executes in your own GitHub Actions, on your
    runners, with your secrets. Aixgo hosts nothing and never sees your code.
  status: >-
    Two loops run end to end: issue to pull request, and fix-on-request.
    Expect rough edges.
  subcta: "Your own GitHub App. Your runners. Your model provider key."
  footnote: "Apache-2.0 · Your runners · A human merges every pull request"

# Four cells. The 0 and the 1 carry the argument, so they get the accent.
stats:
  - value: "Apache-2.0"
    label: "Open source licence"
    accent: false
  - value: "0"
    label: "Lines of your code reach Aixgo"
    accent: true
  - value: "3"
    label: "GitHub App permissions: contents, pull requests, issues"
    accent: false
  - value: "1"
    label: "Label (ax:go) is the only human trigger"
    accent: true

# --- 01 The blocker ---------------------------------------------------------

blockers:
  - title: "Blast radius"
    body: >-
      An agent that can merge has an unbounded blast radius. The question is not
      whether the model is good enough. It is what the model is allowed to reach.
  - title: "Drift"
    body: >-
      An ungated loop wanders. It breaks things, and then reports success,
      because nothing in the loop is qualified to disagree with it.
  - title: "Security review"
    body: >-
      Evaluations die in security review. A pilot that has to send your source
      code to a vendor runtime never gets past the person who signs off on it.
pivot: "So put the agent inside your GitHub instead of sending your code out of it."

# --- 02 Label lifecycle -----------------------------------------------------

lifecycle:
  - label: "ax:go"
    means: "Start work on this issue. The only trigger a person sets."
    by: "You"
    human: true
  - label: "ax:queued"
    means: "Accepted, waiting to start."
    by: "Bot"
  - label: "ax:working"
    means: "Implementing the change."
    by: "Bot"
  - label: "ax:review"
    means: "Review and fix pass in progress."
    by: "Bot"
  - marker: "A human reviews the pull request and merges it. Only then does the bot close the issue."
  - label: "ax:blocked"
    means: "Needs a human. The agent stopped and left a note."
    by: "Bot"
  - label: "ax:done"
    means: "The bot is finished. A human merged the pull request; the bot closes out the issue."
    by: "Bot"

commands:
  - cmd: "@your-app go"
    means: "On an issue, starts work on it, the same as applying ax:go."
  - cmd: "@your-app address"
    means: "On a pull request, addresses the current review feedback."
  - cmd: "@your-app help"
    means: "Lists what it understands."

# --- 03 How it works --------------------------------------------------------

steps:
  - kicker: "Human"
    title: "File and label"
    body: >-
      Someone writes an issue and applies ax:go. That label is the only thing a
      person applies to start the work.
  - kicker: "Agent"
    title: "Implement, then run your gate"
    body: >-
      The agent works on a branch and runs the repository's own quality gate,
      using the gate's output to guide each retry until it passes or it stops
      and asks for a human.
  - kicker: "Agent"
    title: "Open the pull request"
    body: >-
      Once the gate passes, the agent opens a pull request and hands it back.
      That is the strongest action available to it.
  - kicker: "Human · Agent"
    title: "Review, and fix on request"
    body: >-
      A reviewer requests changes. A fixer role reads the feedback, makes the
      changes, re-runs the gate, and pushes back to the same pull request. Only
      feedback left against the current head is addressed, so the loop never
      re-litigates a comment it already handled.
  - kicker: "Human"
    title: "Merge"
    body: >-
      A human merges. The agent does not. There is no code path by which it
      could.

triggers:
  - "An issue labelled ax:go."
  - "A review submitted by an owner, member or collaborator."
  - "A comment that begins with a mention of your own App."

# --- 04 Where it runs -------------------------------------------------------

guarantees:
  - lead: "No Aixgo control plane."
    body: >-
      There is no Aixgo-hosted service managing your repositories. When your
      team installs the App and adds the workflow, the work runs on your
      runners inside your account.
  - lead: "Your code stays in your repos."
    body: "Aixgo never receives it."
  - lead: "Your secrets stay in your secret store."
    body: >-
      Model provider keys and the App's private key are read by your own
      Actions runs and never transit our infrastructure.
  - lead: "Your minutes, your bill."
    body: >-
      A reusable workflow runs with the calling repository's own variables and
      secrets, so you bring your own endpoint and key and pay for your own
      tokens.
  - lead: "One audit signal."
    body: >-
      Everything the agent does appears under your own App's [bot] account.
      That bot is the single thing to audit.

questions:
  - q: "Can it merge its own work?"
    a: "No. The GitHub interface it is built against has no merge method. The capability is absent from the code, not forbidden by a prompt."
  - q: "Does it hold deploy credentials?"
    a: "No deploy credentials and no path to production. Your branch protection rules decide what happens once the pull request exists."
  - q: "Is the gate mandatory?"
    a: "Yes. A repo with no gate is refused rather than defaulted."
  - q: "Can we read the source?"
    a: "Yes, under Apache-2.0. You are free to read, audit, use and fork it."
  - q: "Whose model provider account?"
    a: "Yours. Your endpoint and your key, billed to you, never inherited from Aixgo."

permissions_granted:
  - scope: "Contents"
    body: "Read the repository and push to a branch."
  - scope: "Pull requests"
    body: "Open and update a pull request. Not merge one."
  - scope: "Issues"
    body: "Read issues and manage the ax:* labels."

permissions_denied:
  - scope: "Workflows"
    body: "It cannot add or change anything under .github/workflows/."
  - scope: "Administration"
    body: "It cannot touch repository or branch protection settings."
  - scope: "Environments"
    body: "It cannot reach a deployment environment."
  - scope: "Secrets"
    body: "It cannot read or write repository secrets."

cannot:
  - "Merge a pull request, its own or anyone else's."
  - "Deploy, release, or reach anything in production."
  - "Change a workflow file, or the branch protection that guards it."
  - "Send your code to Aixgo. There is nothing on our side to send it to."

proofs:
  - title: "The interface has no merge method"
    body: "internal/forge/forge.go is the whole GitHub surface the loop is built against. Read it and count the methods."
    url: "https://github.com/aixgo-dev/code/blob/main/internal/forge/forge.go"
  - title: "Every run proves its own scope"
    body: "The workflow calls an Actions-administration endpoint and expects the denial, so your own run log carries the evidence rather than our marketing page."
    url: "https://github.com/aixgo-dev/code/blob/main/.github/workflows/aixgo.yml"
  - title: "The model's shell holds no token"
    body: "GH_TOKEN and GITHUB_TOKEN are stripped from the engine's environment before it starts."
    url: "https://github.com/aixgo-dev/code/blob/main/docs/decisions/0002-no-merge-path.md"

