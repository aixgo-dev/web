    state: "todo"

# --- 09 Fit check -----------------------------------------------------------

fit_for:
  - "You have a backlog of small, well-specified changes and nobody free to do them."
  - "Your repository already has a quality gate you would let decide whether a change is good."
  - "Your security position is that source code does not leave your accounts."
  - "You want implementation help without giving up the merge button."
  - "You would rather read the code than take a vendor's word for what it can reach."

fit_against:
  - "You want an agent that merges its own work. That is the one thing this cannot be configured to do."
  - "You have no gate, and no appetite to write one. A repo with no gate is refused."
  - "Your work is exploratory rather than specified. The loop needs an issue it can finish."
  - "You need a hosted service with a dashboard and an account manager."
  - "You need this running on GitHub Actions against Claude rather than Codex on Azure. That path is not wired up yet."

# --- 10 FAQ -----------------------------------------------------------------

faq:
  - q: "Is it installable yet?"
    a: >-
      Yes. v0.5.0 is the latest release. Install the CLI with go install, create
      your own GitHub App, and run aixgo-code init --workflow in the repository you
      want it working in.
  - q: "Can it merge or deploy?"
    a: >-
      No, on both counts, and not because it is told not to. The GitHub
      interface it is built against has no merge method, and the App holds three
      permissions: contents, pull requests and issues. Not workflows,
      administration, environments or secrets. It holds no deploy credentials
      and has no path to production.
  - q: "Do you see our code?"
    a: >-
      No. There is no Aixgo control plane. The agent runs in your GitHub
      Actions, on your runners, reading your repository with a token your own
      App minted. Nothing is sent to us because there is nothing on our side to
      send it to.
  - q: "Do we need our own GitHub App?"
    a: >-
      Yes. App names are globally unique, so it cannot be named after ours, and
      its private key is what mints the tokens that act on your repository. The
      App is an identity rather than a webhook target: there is no Aixgo server
      to receive deliveries, so the webhook stays disabled.
  - q: "Can it change our workflow files?"
    a: >-
      No. The App is deliberately denied the Workflows permission, so a change
      under .github/workflows/ has to be a human commit or a local CLI run under
      your own gh auth. That is also why the setup files are written locally and
      merged by a person.
  - q: "Why is a gate mandatory?"
    a: >-
      An agent loop with nothing to stop it will wander, break things, and still
      report success. The gate is the safety mechanism, so the tool treats its
      absence as a configuration error rather than a default to paper over. The
      engineering that matters here is the gate, not the loop.
  - q: "What if our CI is not worth trusting?"
    a: >-
      Then that is the first thing to fix, and it was already costing you before
      any agent showed up. A check that has only ever been observed green is
      indistinguishable from no check at all. That is why a repo with no gate is
      refused rather than given a default.
  - q: "Which models does it use?"
    a: >-
      The reusable workflow runs the Codex CLI against Azure OpenAI, with a
      default deployment of gpt-5.4. The Claude Code adapter is written and
      tested behind engine: claude, but it is reachable from a local CLI run
      only: the workflow still installs the Codex CLI alone.
  - q: "What does it cost?"
    a: >-
      The software is Apache-2.0 and free. You pay GitHub for Actions minutes
      and your model provider for tokens, both billed to your own accounts.
  - q: "Can we contribute?"
    a: >-
      The source is open under Apache-2.0, so you are free to read, audit, use
      and fork it. Aixgo Code is not currently accepting external code
      contributions. Bug reports and security reports are welcome through issues
      and the process in SECURITY.md.
