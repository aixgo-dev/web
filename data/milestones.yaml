# Aixgo Development Milestones
# High-level version summaries for homepage display.
#
# Every shipped card carries a real tag and the month that tag was published,
# so the page cannot drift into describing "the current release" as whatever
# was true when someone last edited it. Every line here comes from the release
# notes at github.com/aixgo-dev/aixgo/releases. Planned cards carry no date,
# because a roadmap date nobody re-checks is the same bug in a new place.

milestones:
  - version: "v0.7.4"
    status: "complete"
    date: "May 2026"
    highlights:
      - "Website changes only, so the library is identical to v0.7.3."
      - "Nothing to do if you are already on v0.7.3."

  - version: "v0.7.3"
    status: "complete"
    date: "April 2026"
    highlights:
      - "aixgo doctor reports on your environment setup."
      - "Non-interactive chat: pass a prompt with -p or pipe it in on stdin."
      - "Chat takes readline input, so arrow keys and history work."
      - "Shell completion suggests commands and flags as you type."
      - "Cap a run with --max-tokens and --max-output-kib."
      - "Security fixes: SSRF-safe JWK fetch, path traversal, file perms."

  - version: "v0.7.1"
    status: "complete"
    date: "March 2026"
    highlights:
      - "The chat model picker lists priority models in a stable order."
      - "Tests set env vars per test, so they no longer leak into each other."

  - version: "v0.6.0"
    status: "complete"
    date: "March 2026"
    highlights:
      - "aixgo chat, an interactive coding assistant in the terminal."
      - "Switch models mid-conversation across Claude, GPT-4, Gemini, and Grok."
      - "Sessions persist to JSON files, with cost tracked per session."
      - "MCP-compatible tools for file, git, and terminal, in pkg/tools."
      - "The CLI moved to Cobra, with chat, session, and models subcommands."
      - "New packages: a Kubernetes daemon runtime and a human-in-the-loop API."

  - version: "v0.5.0"
    status: "complete"
    date: "February 2026"
    highlights:
      - "Public provider API: LLM providers live at pkg/llm/provider."
      - "Guided ReAct workflows run step by step, with verification."
      - "Cost calculator API with model pricing data at pkg/llm/cost."

  - version: "v0.4.0"
    status: "complete"
    date: "February 2026"
    highlights:
      - "Go 1.26 with modernized codebase"
      - "6 advanced planner strategies (MCTS, Tree-of-Thought, Backward Chaining)"
      - "4 RAG variants (Conversational, Multi-Query, Hybrid)"
      - "JWT verification with JWKS caching and RS256 signatures"
      - "Reflection pattern with multi-critic aggregation"
      - "Typed MCP tool registration with schema generation"

  - version: "v0.3.3"
    status: "complete"
    date: "February 2026"
    highlights:
      - "8+ LLM providers (OpenAI, Anthropic, Gemini, xAI, Vertex AI, HuggingFace, Ollama)"
      - "13 orchestration patterns (Supervisor, Parallel, RAG, Reflection, MapReduce, etc.)"
      - "Session persistence with JSONL and Redis backends"
      - "Full observability (OpenTelemetry, Langfuse, Prometheus)"
      - "Enterprise security (Auth, RBAC, TLS/mTLS, audit logging)"

  - version: "Next release"
    status: "planned"
    highlights:
      - "Visual workflow debugging dashboard"
      - "Session encryption at rest"
      - "PostgreSQL session backend"
      - "More vector databases (Qdrant, pgvector)"

  - version: "Production release"
    status: "planned"
    highlights:
      - "API stability guarantees under semantic versioning"
      - "A Kubernetes operator to manage agent lifecycles"
      - "Multi-modal input: images, audio, and documents"
      - "Long-term memory and personalization"
      - "Terraform modules for infrastructure"
