- name: "Code"
  url: "/code/"
  description: >-
    An autonomous coding agent in your own GitHub. Issue in, pull request out,
    a human merges. It runs in your Actions, on your runners, with your secrets.
  status: "Beta · v0.5.0 · Apache-2.0"

- name: "Aixgate"
  url: "/aixgate/"
  description: >-
    A deny-by-default sandbox for AI coding agents. Run Claude Code, Cursor,
    Aider or OpenAI Codex without giving them your .env, ~/.aws or ~/.ssh,
    blocked at the syscall boundary, even under prompt injection.
  status: "v0.1 proof of concept · MIT"

- name: "Sync"
  url: "/sync/"
  description: >-
    A coordination plane for sessions, messages and jobs. MCP clients reach
    it through sync-mcp.
  status: "v0.1.0 · Apache-2.0"
