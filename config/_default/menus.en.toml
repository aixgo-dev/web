# Two products sit above Docs because they are products, not reference. When a
# THIRD product lands, stop adding entries here: build /products/ as a hub page
# and collapse these two into one item. That is the trigger condition.
#
# "Code", not "Aixgo Code" — decided 2026-08-10: with the Aixgo wordmark on
# every page, the short label reads fine, and the product page and footer
# note carry the disambiguation.

