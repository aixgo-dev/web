disabled = false

# `locale` and `label` are what Hugo 0.158 renamed `languageCode` and
# `languageName` to. Values carried across unchanged. A Hugo older than 0.158
# ignores both names and falls back to the language key, which is also "en", so
# the RSS <language> element comes out the same either way. That matters here
# because the deploy pin lives in the Cloudflare Pages project rather than in
# this repo and can lag the local version.
locale = "en"
label = "English"
weight = 1
title = "Aixgo"

[params]
displayName = "EN"
isoCode = "en"
rtl = false
dateFormat = "2 January 2006"
description = "AI-native agent framework for Go."
