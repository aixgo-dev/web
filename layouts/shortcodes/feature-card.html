{{/* A feature card for prose pages. Emits the site's one card component
     rather than a second implementation of it. */}}
<div class="ax-card feature-card-item">
  {{ with .Get "icon" }}<div class="feature-icon" aria-hidden="true">{{ . }}</div>{{ end }}
  <h3>{{ .Get "title" }}</h3>
  <p>{{ .Get "description" }}</p>
  {{ with .Get "benefit" }}
  <p class="ax-microlabel feature-benefit">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path d="M13.5 4.5L6 12L2.5 8.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    {{ . }}
  </p>
  {{ end }}
</div>
